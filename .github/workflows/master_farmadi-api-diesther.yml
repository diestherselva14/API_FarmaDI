
name: CI/CD - FarmaDi API en Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: farmadi-api-diesther
  PROJECT_PATH: FarmaDiApi/FarmaDiApi.csproj
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Compilar FarmaDi
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publicar FarmaDiApi
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Subir archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: farmadi-api
          path: ${{ github.workspace }}/publish
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar archivos compilados
        uses: actions/download-artifact@v4
        with:
          name: farmadi-api
          path: ./publish

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_724FDB606DE849F8A000D6A5FDBBD7BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F2EB8C96DC5044F1BEB1FA8B87DE67BA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CA0C26742A3242BFA7F1623092C50960 }}

      - name: Desplegar FarmaDi en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish
